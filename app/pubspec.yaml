name: wanderlust
description: "Paint the streets you've walked. Offline-first, private walking map."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  # FFI to the Rust geo-core (ADR-0003) — used by lib/geo/geo_core_ffi.dart.
  ffi: ^2.1.0

  # User-started Android foreground service for screen-off walk recording.
  geolocator: ^13.0.0
  sqflite: ^2.4.0
  path: ^1.9.0
  crypto: ^3.0.0
  file_picker: ^13.1.0
  xml: ^7.0.0
  image_picker: ^1.2.3

  # Intended Phase-1 stack (added as the features land, so `pub get` stays
  # trivially resolvable while the shell is scaffolded):
  #   maplibre_gl        offline vector basemap — MapLibre Native + PMTiles (ADR-0005)
  #   flutter_rust_bridge   codegen alternative to the hand-written FFI binding

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/AGPL-3.0.txt
    - assets/legal/rust-licenses.json
    # Sample street network + walk, matched live through the Rust geo-core on
    # device to prove the FFI path (see lib/geo/live_match.dart).
    - assets/geo/bremen-center.streets.geojson
    - assets/geo/kreuzberg-sample.geojson
    - assets/geo/walk-goerli.gpx
  # Newsreader (serif) and Work Sans (sans) are the brand faces. They are OFL
  # and will be bundled as assets here (not fetched at runtime — offline-first),
  # wired to the `fontFamily` names used in the theme.
  # fonts:
  #   - family: Newsreader
  #     fonts: [{ asset: assets/fonts/Newsreader-Regular.ttf }, ...]
  #   - family: Work Sans
  #     fonts: [{ asset: assets/fonts/WorkSans-Regular.ttf }, ...]
