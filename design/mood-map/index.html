<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanderlust — Mood &amp; Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    body { background: #E7E2D7; }
    @keyframes sparklePulse {
      0%   { transform: scale(0.3); opacity: 0; }
      12%  { transform: scale(1);   opacity: 1; }
      45%  { transform: scale(2.6); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .sparkle-ring { animation: sparklePulse 3.6s ease-out infinite; transform-origin: center; }
    #canvas {
      font-family: 'Work Sans', sans-serif;
      padding: 72px 64px 120px;
      max-width: 1400px;
      margin: 0 auto;
      color: oklch(0.25 0.02 75);
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <script src="./map-data.js"></script>
  <script src="./android-frame.js"></script>
  <script src="./app.js"></script>
</body>
</html>
