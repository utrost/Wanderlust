MaintainerNotes: |-
  Flutter app with Rust JNI libraries built from source using cargo-ndk.
  geolocator_android is a vendored MIT source fork; proprietary Google Play
  Services code and dependency are removed, not excluded by scanner exceptions.
  tools/toolchain.env pins the SDKs; Cargo.lock and app/pubspec.lock pin packages.
  Candidate workflow: .github/workflows/store-build.yml.
  Build-server adaptation must provision the pinned Flutter SDK, Rust targets,
  cargo-ndk and Android NDK before calling tools/prepare_android.sh. Populate
  offline caches in the preparation stage; do not bypass dependency scanning.
  Unsigned release APKs are intentional. No upstream signing credential needed.
  Privacy text: app/assets/legal/privacy.txt; public HTML: docs/privacy.html.

