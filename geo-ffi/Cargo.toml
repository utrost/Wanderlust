[package]
name = "geo-ffi"
version = "0.0.1"
description = "C ABI + IO layer over geo-core, for the Flutter surface to call via FFI (ADR-0003)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "wanderlust_geo"
# cdylib for Android (.so) and the host test; staticlib for iOS; rlib so the
# crate's own integration tests can link it.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
geo-core = { path = "../geo-core" }
serde_json = "1"
