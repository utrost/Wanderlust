name: Store candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'geo-*/**'
      - 'tools/**'
      - 'Cargo.lock'
      - '.github/workflows/store-build.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        run: sed '/^#/d; /^$/d' tools/toolchain.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android tooling
        run: |
          sdkmanager "ndk;$NDK_VERSION" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Prepare and test
        run: |
          bash tools/prepare_android.sh
          python3 -m unittest discover -s tools/tests -v
          cargo build --release --locked -p geo-ffi
          cd app
          flutter pub get --enforce-lockfile
          flutter analyze
          WANDERLUST_NATIVE_TESTS=1 LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/release" flutter test
      - name: Build unsigned production artifacts
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64,android-x64 --build-number "$((100000 + GITHUB_RUN_NUMBER))"
          flutter build appbundle --release --target-platform android-arm64,android-x64 --build-number "$((100000 + GITHUB_RUN_NUMBER))"
      - name: Verify production artifacts
        run: |
          python3 tools/verify_store_build.py app/build/app/outputs/flutter-apk/app-release.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          python3 tools/verify_store_build.py app/build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        # PR verification remains useful even if the account's artifact quota is full.
        continue-on-error: true
        with:
          name: unsigned-store-candidate
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Save manual candidate as a draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="store-candidate-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          apk="wanderlust-${GITHUB_SHA::7}-unsigned.apk"
          bundle="wanderlust-${GITHUB_SHA::7}-unsigned.aab"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "$bundle"
          notes="$RUNNER_TEMP/store-candidate-notes.txt"
          cat > "$notes" <<EOF
          Unsigned production candidate from $GITHUB_SHA.
          Build number: $((100000 + GITHUB_RUN_NUMBER)).

          These APK/AAB files passed release packaging checks. They need the chosen
          production signing credentials before distribution. For phone testing,
          use the separately signed Test APK prerelease instead.

          This is a draft for review, not a Play Store or F-Droid submission.
          See docs/ANDROID_UPDATES.md for outstanding publication gates.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$bundle" --clobber
          else
            gh release create "$tag" "$apk" "$bundle" --draft --prerelease \
              --target "$GITHUB_SHA" --title "Wanderlust unsigned store candidate" \
              --notes-file "$notes"
          fi
          url=$(gh release view "$tag" --json url --jq .url)
          echo "Unsigned candidate saved in [a draft release]($url)." >> "$GITHUB_STEP_SUMMARY"
