name: Test APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to publish as a prerelease, e.g. test-apk-2026-07-31"
        required: false
        type: string
  push:
    branches: ["main"]
    tags: ["test-apk-*"]

# Cancel superseded builds on the same branch/tag, but keep distinct manual runs.
concurrency:
  group: test-apk-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-apk:
    name: build Android test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Prepare Android (scaffold + permissions + native geo-core)
        run: bash tools/prepare_android.sh

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64,android-x64

      - name: Verify APK native libraries and Bremen asset
        run: python3 tools/verify_apk.py app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Name APK for testers
        id: package
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk_name="wanderlust-test-${short_sha}.apk"
          cp app/build/app/outputs/flutter-apk/app-debug.apk "$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      # Release assets remain available when Actions artifact storage is full.
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            release_tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/test-apk-* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="test-apk-${GITHUB_SHA::7}"
          fi
          git check-ref-format "refs/tags/$release_tag"
          notes_file="$RUNNER_TEMP/test-apk-notes.md"
          cat > "$notes_file" <<EOF
          Wanderlust Android test APK built from $GITHUB_SHA.

          Download the .apk asset below directly on your Android phone.
          For install steps, see README.md → Installing the Android test app.
          EOF
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$APK_NAME" --clobber
            gh release edit "$release_tag" --prerelease --title "Wanderlust test APK ${release_tag}" --notes-file "$notes_file"
          else
            gh release create "$release_tag" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "Wanderlust test APK ${release_tag}" \
              --notes-file "$notes_file" \
              --prerelease
          fi
          release_url=$(gh release view "$release_tag" --json url --jq .url)
          echo "Download the Android APK from [$release_tag]($release_url)." >> "$GITHUB_STEP_SUMMARY"
