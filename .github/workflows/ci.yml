name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geo-core:
    name: geo-core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rebuild and test street network
        run: python3 -m unittest discover -s tools/tests -v
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Evaluate real Bremen network with synthetic traces
        run: |
          cargo build --release -p geo-ffi
          python3 tools/evaluate_matching.py --check
          python3 tools/evaluate_matching.py --step-m 5 --check --output tools/out/evaluation-5m

  app:
    name: app (Flutter + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Prepare Android (scaffold + permissions + native geo-core)
        run: bash tools/prepare_android.sh

      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Build host library for real FFI integration test
        run: cargo build --release -p geo-ffi
      - name: Test (including real Rust FFI and SQLite)
        working-directory: app
        env:
          WANDERLUST_NATIVE_TESTS: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64,android-x64

      - name: Verify APK native libraries and Bremen asset
        run: python3 tools/verify_apk.py app/build/app/outputs/flutter-apk/app-debug.apk
