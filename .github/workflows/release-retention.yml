name: Keep latest preview releases

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test APK", "Store candidate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: preview-release-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Always use trusted default-branch code, not the triggering run's commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Retain five test APKs and five draft store candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/prune_preview_releases.py --repo "$GH_REPO" --apply
